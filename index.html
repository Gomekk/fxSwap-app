<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FXスワップ管理</title>
<meta name="theme-color" content="#1D3A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FXスワップ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEE3; --paper-2:#E2E6D8; --card:#F6F7F0;
  --ink:#1D3A33; --ink-2:#4E625B; --ink-3:#7D8C86;
  --violet:#5B4B8A; --gold:#A8843A;
  --gain:#2C7A56; --loss:#B23E36; --buy:#B45309; --sell:#1E3A8A;
  --line:#C9D0C0; --bar:#8DB7A2; --overlay:rgba(20,35,30,.45);
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111B18; --paper-2:#17231F; --card:#1A2723;
    --ink:#DDE6DF; --ink-2:#A9B8B1; --ink-3:#74847D;
    --violet:#A597D6; --gold:#D2B268;
    --gain:#6CC49A; --loss:#EE8078; --buy:#FDBA74; --sell:#93C5FD;
    --line:#2C3B36; --bar:#3E7560; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111B18; --paper-2:#17231F; --card:#1A2723;
  --ink:#DDE6DF; --ink-2:#A9B8B1; --ink-3:#74847D;
  --violet:#A597D6; --gold:#D2B268;
  --gain:#6CC49A; --loss:#EE8078; --buy:#FDBA74; --sell:#93C5FD;
  --line:#2C3B36; --bar:#3E7560; --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 120px}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 6px}
header.top h1{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.08em;margin:0}
.status{font-size:12px;color:var(--ink-3)}

.cert{position:relative;margin:10px 0 18px;padding:26px 20px 20px;border:1px solid var(--ink);border-radius:4px;background:var(--card);overflow:hidden}
.cert::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.cert svg.rosette{position:absolute;right:-120px;top:-110px;width:330px;height:330px;opacity:.4;pointer-events:none}
.cert .inner{position:relative}
.cert .cap{font-size:13px;color:var(--ink-2)}
.cert .big{font-family:var(--serif);font-weight:800;font-size:clamp(40px,12vw,60px);line-height:1.05;letter-spacing:.01em;margin:4px 0 2px}
.cert .big small{font-size:.45em;font-weight:700;margin-right:.08em}
.cert .rate{font-size:13px;color:var(--ink-2)}
.cert .rate b{font-weight:700;color:var(--ink)}
.cert dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:20px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.cert dt{font-size:12px;color:var(--ink-3)}
.cert dd{margin:0;font-family:var(--serif);font-weight:700;font-size:20px}
.cert dd .d{display:block;font-family:var(--sans);font-size:12px;font-weight:500}
.cert .asof{position:relative;margin-top:14px;font-size:12px;color:var(--ink-3)}
.gain,.cert .rate b.gain{color:var(--gain)} .loss,.cert .rate b.loss{color:var(--loss)}

.due{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin:0 0 18px;border-radius:4px;background:var(--ink);color:var(--paper)}
.due p{margin:0;font-size:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.due .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.small{padding:6px 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--loss);border-color:var(--loss)}
.btn:disabled{opacity:.5;cursor:default}

section h2{font-family:var(--serif);font-weight:700;font-size:18px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 .act{font-family:var(--sans);font-size:13px;font-weight:500}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--violet);font-weight:700;font-size:13px}
.setgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 6px}
.setbtn{display:block;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.setbtn .t{display:block;font-family:var(--serif);font-weight:700;font-size:15px}
.setbtn .d{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.setbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.subhead{margin:4px 0 2px}
.hint{font-size:13px;color:var(--ink-3);margin:6px 0}

.chart{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);padding:2px 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows button.row{all:unset;box-sizing:border-box;display:grid;width:100%;padding:12px 2px;cursor:pointer;gap:2px 10px}
.rows button.row:focus-visible{outline:2px solid var(--violet)}
.wk{grid-template-columns:auto 1fr auto}
.wk .date{font-family:var(--serif);font-weight:700;font-size:15px;grid-row:span 2;align-self:center;min-width:5.2em}
.wk .eq{font-weight:700;text-align:right;grid-column:3}
.wk .sub{grid-column:2 / 4;text-align:right;font-size:12px;color:var(--ink-2)}
.wk .mid{grid-column:2;font-size:12px;color:var(--ink-2)}
.pos{grid-template-columns:1fr auto}
.pos .p{font-weight:700}
.pos .v{text-align:right;font-weight:700}
.pos .m{font-size:12px;color:var(--ink-2)}
.pos .mr{font-size:12px;color:var(--ink-2);text-align:right}
.broker{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--line)}
.holdseg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 10px}
.holdseg button{border:0;background:var(--card);padding:6px 14px;font-size:12.5px;color:var(--ink-2)}
.holdseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid currentColor;border-radius:3px;margin-left:6px;font-weight:500;vertical-align:1px}
.tag-buy{color:var(--buy)}
.tag-sell{color:var(--sell)}
.posc{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:9px 2px;cursor:pointer;font-size:12.5px}
.posc .pc-pair{font-weight:700;flex:0 0 auto}
.posc .pc-date{color:var(--ink-3);flex:0 0 auto}
.posc .pc-units{flex:1 1 auto;text-align:right;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.posc .pc-rate{color:var(--ink-2);flex:0 0 auto;min-width:2.6em;text-align:right}
.cashc{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:9px 2px;cursor:pointer;font-size:12.5px}
.cashc .cc-date{color:var(--ink-3);flex:0 0 auto}
.cashc .cc-broker{flex:1 1 auto;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cashc .cc-amt{flex:0 0 auto;font-weight:700;min-width:5em;text-align:right}
.goalrow{margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.goalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.goalhead span{font-family:var(--serif);font-weight:700;font-size:15px}
.goalhead input{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px;text-align:right}
.goalbar{height:8px;border-radius:4px;background:var(--paper-2);overflow:hidden;margin-bottom:4px}
.goalfill{height:100%;background:var(--violet)}
.goalstat{font-size:12.5px;color:var(--ink-2)}

table.sum{width:100%;border-collapse:collapse;font-size:13px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card)}
table.sum th,table.sum td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.sum.tight th,table.sum.tight td{padding:6px 4px;font-size:12px}
table.sum.tight th:first-child,table.sum.tight td:first-child{font-size:12.5px}
table.sum th{font-weight:500;color:var(--ink-3);font-size:12px}
table.sum th:first-child,table.sum td:first-child{text-align:left;font-weight:700}
table.sum tr:last-child td{border-bottom:0}
table.sum tfoot td{border-top:1px solid var(--ink);font-weight:700}

.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:4px;text-align:center;color:var(--ink-2);font-size:14px}
.empty .btn{margin-top:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:12px 0 10px;font-size:13px;color:var(--ink-3);font-weight:500;border-top:2px solid transparent;margin-top:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}

.scrim{position:fixed;inset:0;background:var(--overlay);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--paper);border-radius:14px 14px 0 0;z-index:21;transform:translateY(105%);transition:transform .22s ease;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .in{max-width:640px;margin:0 auto;padding:16px 18px 24px}
.sheet h3{font-family:var(--serif);font-size:19px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center}
.close{background:none;border:0;font-size:22px;line-height:1;padding:4px 8px;color:var(--ink-2)}
.f{display:block;margin:0 0 14px}
.f span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:16px;height:44px;box-sizing:border-box}
.f input[type="date"]{padding:10px 12px}
.f input:focus,.f select:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 0;font-size:14px;color:var(--ink-2)}
.seg button:not(:first-child){border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.calc{margin:6px 0 16px;padding:12px 14px;background:var(--paper-2);border-radius:6px;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.calc b{font-family:var(--serif);font-size:17px}
.brokerRow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;align-items:center;margin-bottom:8px}
.brokerRow input{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:16px;width:100%}
.x{background:none;border:0;color:var(--ink-3);font-size:18px;padding:4px 6px}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.actions .right{display:flex;gap:10px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
@media (min-width:600px){.cert dl{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>FXスワップ管理</h1><span class="status"><span id="status"></span> <button class="linkbtn" id="logout" hidden>ログアウト</button></span></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" hidden aria-label="画面切り替え"><div class="in" role="tablist">
  <button role="tab" data-tab="trend" aria-selected="true">ホーム</button>
  <button role="tab" data-tab="hold" aria-selected="false">保有</button>
  <button role="tab" data-tab="closed" aria-selected="false">決済</button>
  <button role="tab" data-tab="goals" aria-selected="false">目標・実績</button>
  <button role="tab" data-tab="settings" aria-selected="false">設定</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
const SUPABASE_URL = "https://mspzgfkommmuucjvdvbm.supabase.co";
const SUPABASE_KEY = "sb_publishable_sj2rETV0MdsP1hA56C70kQ_F5eS1Via";

const BROKERS = ["外為どっとコム","GMOクリック証券","みんなのFX","トライオートFX","セントラル短資"];
const PAIRS = ["TRY/JPY","MXN/JPY","ZAR/JPY","HUF/JPY","PLN/JPY","CHF/MXN","CHF/TRY","CHF/ZAR"];
const LIGHT_PAIRS = { "みんなのFX": ["TRY/JPY","MXN/JPY","ZAR/JPY","HUF/JPY"] };
const pairsFor = broker => {
  const extra = new Set(LIGHT_PAIRS[broker] || []);
  const out = [];
  PAIRS.forEach(p => { out.push(p); if (extra.has(p)) out.push(p + "(LIGHT)"); });
  return out;
};
const COLS = ["weeks","positions","closed","cash","settings","goals","milestones"];
const state = {weeks:[],positions:[],closed:[],cash:[],settings:[],goals:[],milestones:[]};
let ready = false, authKnown = false, session = null, tab = "trend";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v === "" || v == null) return 0; const n = Number(String(v).replace(/[¥,\s円]/g,"")); return isFinite(n) ? n : 0; };
const yen = n => (n < 0 ? "−" : "") + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
const cls = n => n > 0 ? "gain" : n < 0 ? "loss" : "";
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (s,n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = s => s ? s.slice(2).replace(/-/g,"/") : "";
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800); };

const weeksSorted = () => [...state.weeks].sort((a,b) => a.date < b.date ? -1 : 1);
const monthly = w => w.monthly != null ? w.monthly : w.daily * 30;
const yearly = w => w.yearly != null ? w.yearly : w.daily * 365;
const cashPrincipal = () => state.cash.reduce((s,c) => s + (c.kind === "out" ? -1 : c.kind === "cashback" ? 0 : 1) * num(c.amount), 0);
const settingFor = (broker, pair) => state.settings.find(x => x.broker === broker && x.pair === pair);
const lotSize = (broker, pair) => { const s = settingFor(broker, pair); return s && num(s.lotSize) > 0 ? num(s.lotSize) : null; };
const orderUnitFactor = (broker, pair) => minUnitLabel(broker) === "万通貨" ? 10000 : lotSize(broker, pair);
const minLotOf = broker => { const s = settingFor(broker, ""); return s && s.minLot !== "" && s.minLot != null ? num(s.minLot) : null; };
const maxPositionOf = (broker, pair) => { const s = settingFor(broker, pair); return s && s.maxPosition !== "" && s.maxPosition != null ? num(s.maxPosition) : null; };
const MAXPOS_UNIT = { "外為どっとコム":"lot", "GMOクリック証券":"lot", "みんなのFX":"lot", "トライオートFX":"万通貨", "セントラル短資":"万通貨" };
const MINLOT_UNIT = { "外為どっとコム":"lot", "GMOクリック証券":"lot", "みんなのFX":"lot", "トライオートFX":"万通貨", "セントラル短資":"lot" };
const maxPositionUnits = (broker, pair) => { const m = maxPositionOf(broker, pair); if (m == null) return null; if (MAXPOS_UNIT[broker] === "万通貨") return m * 10000; const ls = lotSize(broker, pair); return ls ? m * ls : null; };
const minUnitLabel = broker => MINLOT_UNIT[broker] || "lot";
const minViolation = (broker, lots, units) => {
  const min = minLotOf(broker); if (min == null) return null;
  const unit = minUnitLabel(broker);
  const bad = unit === "万通貨" ? (units < min * 10000) : (lots < min);
  return bad ? {min, unit} : null;
};
const swapPointOf = (broker, pair) => { const s = settingFor(broker, pair); return s && s.swapPoint !== "" && s.swapPoint != null ? num(s.swapPoint) : null; };
const marginRequiredOf = (broker, pair) => { const s = settingFor(broker, pair); return s && s.marginRequired !== "" && s.marginRequired != null ? num(s.marginRequired) : null; };
const posDailySwap = p => { const sp = swapPointOf(p.broker, p.pair); return sp == null ? 0 : sp * num(p.lots) * (p.side === "sell" ? -1 : 1); };
const inputStyle = (w, align="right") => `width:100%;max-width:${w}px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:14px;text-align:${align}`;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = {weeks:"weeks", positions:"positions", closed:"closed_positions", cash:"cash_flows", settings:"settings", goals:"goals", milestones:"goal_milestones"};
const NUMS = new Set(["equity","principal","daily","units","swap","margin","fxPl","swapTotal","amount","lots","lotSize","minLot","maxPosition","monthlyTarget","yearlyTarget","principalTarget","swapPoint","marginRequired","targetAmount"]);
const toSnake = k => k.replace(/[A-Z]/g, m => "_" + m.toLowerCase());
const toCamel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const fromRow = r => { const o = {}; for (const k in r){ const c = toCamel(k); o[c] = NUMS.has(c) && r[k] != null ? Number(r[k]) : r[k]; } return o; };
const toRow = d => { const o = {}; for (const k in d){ if (k === "id") continue; let v = d[k]; if (v === "" && /date$/i.test(k)) v = null; o[toSnake(k)] = v; } return o; };

async function load(col){
  const { data, error } = await sb.from(TABLE[col]).select("*");
  if (error){ $("#status").textContent = "読み込みエラー：" + error.message; return; }
  state[col] = data.map(fromRow);
}
async function loadAll(){
  $("#status").textContent = "読み込み中…";
  await Promise.all(COLS.map(load));
  ready = true;
  if ($("#status").textContent === "読み込み中…") $("#status").textContent = "";
  render();
}
async function saveSetting(broker, pair, patch){
  const row = toRow({broker, pair, ...patch}); row.user_id = session.user.id;
  const { error } = await sb.from("settings").upsert(row, { onConflict: "user_id,broker,pair" });
  if (error){ toast("保存できませんでした：" + error.message); return false; }
  const s = state.settings.find(x => x.broker === broker && x.pair === pair);
  if (s) Object.assign(s, patch); else state.settings.push({id:null, broker, pair, ...patch});
  toast("保存しました");
  return true;
}
async function saveGoal(patch){
  const row = toRow(patch); row.user_id = session.user.id;
  const { error } = await sb.from("goals").upsert(row, { onConflict: "user_id" });
  if (error){ toast("保存できませんでした：" + error.message); return false; }
  if (state.goals[0]) Object.assign(state.goals[0], patch); else state.goals.push({id:null, ...patch});
  toast("保存しました");
  return true;
}
async function save(col, id, data){
  const row = toRow(data); row.user_id = session.user.id;
  let q;
  if (col === "weeks" && !id) q = sb.from("weeks").upsert(row, { onConflict: "user_id,date" });
  else if (col === "settings" && !id) q = sb.from("settings").upsert(row, { onConflict: "user_id,broker,pair" });
  else if (col === "goals" && !id) q = sb.from("goals").upsert(row, { onConflict: "user_id" });
  else if (id) q = sb.from(TABLE[col]).update(row).eq("id", id);
  else q = sb.from(TABLE[col]).insert(row);
  const { error } = await q;
  if (error){ toast("保存できませんでした：" + error.message); return false; }
  await load(col); render(); return true;
}
async function removeDoc(col, id){
  const { error } = await sb.from(TABLE[col]).delete().eq("id", id);
  if (error){ toast("削除できませんでした：" + error.message); return; }
  await load(col); render();
}
function boot(){
  sb.auth.onAuthStateChange((event, s) => {
    const before = session && session.user.id;
    session = s; authKnown = true;
    $("#logout").hidden = !s; $("#tabs").hidden = !s;
    if (!s){ ready = false; COLS.forEach(c => state[c] = []); render(); }
    else if (before !== s.user.id){ render(); setTimeout(loadAll, 0); }
  });
  $("#logout").onclick = async () => { if (confirm("ログアウトしますか？")) await sb.auth.signOut(); };
  document.addEventListener("visibilitychange", () => { if (!document.hidden && session && ready) loadAll(); });
}

function viewLogin(){
  return `<div class="cert">${rosette()}<div class="inner">
    <p class="cap">ログイン</p>
    <form id="loginForm" style="margin-top:12px">
      <label class="f"><span>メールアドレス</span><input name="email" type="email" autocomplete="username" required></label>
      <label class="f"><span>パスワード</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="hint" id="loginMsg"></p>
      <button class="btn" type="submit">ログインする</button>
    </form></div></div>`;
}
function bindLogin(){
  const f = $("#loginForm");
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector("button"); btn.disabled = true; $("#loginMsg").textContent = "確認中…";
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    btn.disabled = false;
    $("#loginMsg").textContent = error ? (/invalid/i.test(error.message) ? "メールアドレスかパスワードが違います" : "ログインできませんでした：" + error.message) : "";
  };
}

function rosette(){
  const R = 150, paths = [];
  const specs = [[96,-7,58,"var(--violet)"],[88,-11,46,"var(--ink)"],[70,-5,40,"var(--gold)"],[118,-13,24,"var(--violet)"]];
  for (const [a,k,b,col] of specs){
    let d = "";
    for (let i = 0; i <= 1440; i++){
      const t = i/1440 * Math.PI*2;
      const r = a + b*Math.cos(Math.abs(k)*t);
      const x = R + r*Math.cos(t) + 12*Math.cos((Math.abs(k)+1)*t);
      const y = R + r*Math.sin(t) + 12*Math.sin((Math.abs(k)+1)*t);
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    paths.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width=".6" stroke-opacity=".7"/>`);
  }
  for (let i = 0; i < 48; i++){
    const t = i/48*Math.PI*2;
    paths.push(`<ellipse cx="${R}" cy="${R}" rx="${140}" ry="${38}" transform="rotate(${(t*180/Math.PI).toFixed(1)} ${R} ${R})" fill="none" stroke="var(--ink)" stroke-width=".25" stroke-opacity=".35"/>`);
  }
  return `<svg class="rosette" viewBox="0 0 300 300" aria-hidden="true">${paths.join("")}</svg>`;
}

function render(){
  if (!authKnown || (session && !ready)){ $("#view").innerHTML = `<p class="hint" style="padding:40px 0;text-align:center">読み込み中…</p>`; return; }
  if (!session){ $("#view").innerHTML = viewLogin(); bindLogin(); return; }
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const v = $("#view");
  v.innerHTML = tab === "trend" ? viewTrend() : tab === "hold" ? viewHold() : tab === "closed" ? viewClosed() : tab === "goals" ? viewGoals() : viewSettings();
  bindView();
}

let weeksExpanded = false;
function viewTrend(){
  const ws = weeksSorted();
  const last = ws[ws.length-1], prev = ws[ws.length-2];
  let html = "";
  if (!last){
    html += `<div class="cert">${rosette()}<div class="inner"><p class="cap">1日あたりのスワップ</p><p class="big"><small>¥</small>—</p>
      <p class="rate">週に一度、有効評価額とスワップを記録すると、ここに最新の状況が表示されます。</p></div></div>
      <div class="empty">まだ記録がありません。<br><button class="btn" data-act="record">最初の記録をつける</button></div>`;
    return html;
  }
  const profit = last.equity - last.principal;
  const dEq = prev ? last.equity - prev.equity : null;
  const dSw = prev ? last.daily - prev.daily : null;
  const yieldPct = last.equity > 0 ? yearly(last) / last.equity * 100 : 0;
  html += `<div class="cert">${rosette()}<div class="inner">
    <p class="cap">1日あたりのスワップ<button class="linkbtn" data-act="swapBreakdown" style="margin-left:8px">内訳</button></p>
    <p class="big"><small>¥</small>${Math.round(last.daily).toLocaleString("ja-JP")}</p>
    <p class="rate">${dSw != null ? `前週比 <b class="${cls(dSw)}">${signed(dSw)}</b>　` : ""}評価額に対する年間スワップ <b>${yieldPct.toFixed(0)}%</b></p>
    <dl>
      <div><dt>有効評価額</dt><dd>${yen(last.equity)}${dEq != null ? `<span class="d ${cls(dEq)}">前週比 ${signed(dEq)}</span>` : ""}</dd></div>
      <div><dt>利益（評価−元金）</dt><dd class="${cls(profit)}">${signed(profit)}<span class="d" style="color:var(--ink-3)">元金 ${yen(last.principal)}</span></dd></div>
      <div><dt>月間スワップ</dt><dd>${yen(monthly(last))}</dd></div>
      <div><dt>年間スワップ</dt><dd>${yen(yearly(last))}</dd></div>
    </dl></div>
    <p class="asof">${fmtDate(last.date)} 時点の記録</p></div>`;
  const next = addDays(last.date, 7), gap = daysBetween(next, today());
  if (gap >= 0){
    html += `<div class="due"><p>${gap === 0 ? "今日は記録日です" : `前回から${daysBetween(last.date,today())}日経過しています`}</p><button class="btn" data-act="record">記録する</button></div>`;
  }
  html += `<section><h2>推移</h2>${chart(ws)}</section>`;
  html += `<section><h2>週ごとの記録<span class="act"><button class="linkbtn" data-act="record">＋ 記録</button></span></h2><ul class="rows">`;
  const limit = weeksExpanded ? ws.length : Math.min(5, ws.length);
  for (let i = ws.length-1, n = 0; i >= 0 && n < limit; i--, n++){
    const w = ws[i], p = ws[i-1], d = p ? w.equity - p.equity : null, pr = w.equity - w.principal;
    html += `<li><button class="row wk" data-edit-week="${esc(w.id)}">
      <span class="date">${fmtDate(w.date)}</span>
      <span class="mid">1日 ${yen(w.daily)}</span>
      <span class="eq">${yen(w.equity)}</span>
      <span class="sub">利益 <span class="${cls(pr)}">${signed(pr)}</span>${d != null ? `　前週比 <span class="${cls(d)}">${signed(d)}</span>` : ""}</span>
    </button></li>`;
  }
  html += `</ul>${ws.length > 5 ? `<div style="text-align:center;margin-top:8px"><button class="linkbtn" data-act="toggleWeeks">${weeksExpanded ? "閉じる" : "全表示"}</button></div>` : ""}</section>`;
  return html;
}

function chart(ws){
  const data = ws.slice(-26);
  if (data.length < 2) return `<p class="hint">2週分以上の記録がたまるとグラフが表示されます。</p>`;
  const W = window.innerWidth < 600 ? 460 : 720, H = window.innerWidth < 600 ? 230 : 250, L = 58, Rt = 66, T = 14, B = 30, iw = W-L-Rt, ih = H-T-B;
  const maxS = Math.max(...data.map(w => w.daily)) * 1.15 || 1;
  const eqs = data.map(w => w.equity), minE = Math.min(...eqs), maxE = Math.max(...eqs);
  const pad = (maxE - minE) * .25 || maxE*.1 || 1, e0 = Math.max(0, minE - pad), e1 = maxE + pad;
  const bw = iw / data.length;
  const xs = i => L + bw*i + bw/2;
  const ys = v => T + ih - v/maxS*ih;
  const ye = v => T + ih - (v-e0)/(e1-e0)*ih;
  const fnum = n => Math.round(n).toLocaleString("ja-JP");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="1日あたりスワップと有効評価額の推移">`;
  for (let g = 0; g <= 4; g++){
    const y = T + ih*g/4;
    s += `<line x1="${L}" x2="${W-Rt}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L-6}" y="${y+4}" text-anchor="end" font-size="9.5" fill="var(--ink-3)">¥${fnum(maxS*(1-g/4))}</text>`;
    s += `<text x="${W-Rt+6}" y="${y+4}" font-size="9.5" fill="var(--violet)">¥${fnum(e1-(e1-e0)*g/4)}</text>`;
  }
  data.forEach((w,i) => {
    const h = ih - (ys(w.daily)-T);
    s += `<rect x="${(xs(i)-bw*.32).toFixed(1)}" y="${ys(w.daily).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" fill="var(--bar)" rx="1"><title>${fmtDate(w.date)} 1日 ${yen(w.daily)}</title></rect>`;
  });
  let lastMonth = null;
  data.forEach((w,i) => {
    const mo = (w.date||"").slice(0,7);
    const show = i === 0 || i === data.length-1 || mo !== lastMonth;
    if (show){ lastMonth = mo; s += `<text x="${xs(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${fmtDate(w.date).slice(3)}</text>`; }
  });
  s += `<polyline points="${data.map((w,i)=>xs(i).toFixed(1)+","+ye(w.equity).toFixed(1)).join(" ")}" fill="none" stroke="var(--violet)" stroke-width="2.2" stroke-linejoin="round"/>`;
  data.forEach((w,i) => s += `<circle cx="${xs(i).toFixed(1)}" cy="${ye(w.equity).toFixed(1)}" r="3" fill="var(--card)" stroke="var(--violet)" stroke-width="1.6"><title>${fmtDate(w.date)} 有効評価 ${yen(w.equity)}</title></circle>`);
  s += `</svg>`;
  return `<div class="chart"><div class="legend"><span><i style="background:var(--bar)"></i>1日あたりスワップ（左）</span><span><i style="background:var(--violet);height:3px;vertical-align:3px"></i>有効評価額（右）</span></div>${s}</div>`;
}

function openSwapBreakdown(){
  const g = {};
  state.positions.forEach(p => { g[p.pair] ||= 0; g[p.pair] += posDailySwap(p); });
  const rows = Object.entries(g).sort((a,c) => c[1] - a[1]);
  const total = rows.reduce((s,[,v]) => s + v, 0);
  let body = `<div class="calc"><span>全証券会社の合計</span><b class="${cls(total)}">${signed(total)}</b></div>`;
  if (!rows.length){
    body += `<p class="hint">保有ポジションがありません。</p>`;
  } else {
    body += `<div class="tablebox"><table class="sum" style="width:100%"><thead><tr><th style="text-align:left">通貨ペア</th><th>1日あたりスワップ</th></tr></thead><tbody>`;
    rows.forEach(([pair, v]) => { body += `<tr><td style="text-align:left">${esc(pair)}</td><td class="${cls(v)}">${signed(v)}</td></tr>`; });
    body += `</tbody></table></div>`;
  }
  openSheet("通貨ペアごとの1日あたりスワップ", body);
}

let holdView = {}; // 証券会社ごとの表示（"summary" | "list"）。既定はサマリー
function viewHold(){
  const ps = state.positions;
  let html = `<section><h2>保有ポジション<span class="act"><button class="linkbtn" data-act="addPos">＋ 追加</button></span></h2>`;
  if (!ps.length) return html + `<div class="empty">保有中のポジションを登録しておけます。<br><button class="btn" data-act="addPos">ポジションを追加</button></div></section>`;
  const byB = {};
  ps.forEach(p => (byB[p.broker||"未設定"] ||= []).push(p));
  for (const [b, list] of Object.entries(byB)){
    const view = holdView[b] || "summary";
    const brokerDaily = list.reduce((s,p) => s + posDailySwap(p), 0);
    html += `<div class="broker"><span>${esc(b)}</span><span>1日 ${signed(brokerDaily)}</span></div>
      <div class="holdseg" data-broker="${esc(b)}"><button data-v="summary" aria-pressed="${view==="summary"}">サマリー</button><button data-v="list" aria-pressed="${view==="list"}">一覧</button></div>`;
    if (view === "summary"){
      const g = {};
      list.forEach(p => { g[p.pair] ||= {units:0, lots:0, buy:0, sell:0, swap:0}; g[p.pair].units += num(p.units); g[p.pair].lots += num(p.lots); g[p.pair][p.side === "sell" ? "sell" : "buy"]++; g[p.pair].swap += posDailySwap(p); });
      html += `<div class="tablebox"><table class="sum" style="width:100%"><thead><tr><th style="text-align:left">通貨ペア</th><th>数量</th><th>スワップ</th><th>内訳</th></tr></thead><tbody>`;
      Object.entries(g).sort((a,c) => a[0].localeCompare(c[0])).forEach(([pair, agg]) => {
        html += `<tr><td style="text-align:left">${esc(pair)}</td><td>${num(agg.units).toLocaleString("ja-JP")}通貨(${agg.lots}lot)</td><td class="${cls(agg.swap)}">${signed(agg.swap)}</td><td>${agg.buy ? `<span class="tag tag-buy">買${agg.buy}</span>` : ""}${agg.sell ? `<span class="tag tag-sell">売${agg.sell}</span>` : ""}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    } else {
      html += `<ul class="rows">`;
      [...list].sort((a,c) => (c.openDate||"").localeCompare(a.openDate||"")).forEach(p => {
        html += `<li><button class="posc" data-edit-pos="${esc(p.id)}">
          <span class="pc-pair">${esc(p.pair)}</span>
          <span class="pc-date">${p.openDate ? fmtDate(p.openDate) : ""}</span>
          <span class="pc-units">${num(p.units).toLocaleString("ja-JP")}通貨${p.lots ? `(${p.lots}lot)` : ""}</span>
          <span class="tag ${p.side === "sell" ? "tag-sell" : "tag-buy"}">${p.side === "sell" ? "売" : "買"}</span>
          <span class="pc-rate">${p.rate ? esc(p.rate) : "—"}</span>
        </button></li>`;
      });
      html += `</ul>`;
    }
  }
  return html + `</section>`;
}

function viewClosed(){
  const cs = [...state.closed].sort((a,b) => (b.closeDate||"").localeCompare(a.closeDate||""));
  let html = `<section><h2>通貨ペア別の実現損益<span class="act"><button class="linkbtn" data-act="addClosed">＋ 決済を追加</button></span></h2>`;
  if (!cs.length) return html + `<div class="empty">決済したポジションを記録すると、通貨ペアごとの為替損益と受け取ったスワップを集計します。<br><button class="btn" data-act="addClosed">決済を追加</button></div></section>`;
  const g = {};
  cs.forEach(c => { const k = c.pair||"—"; g[k] ||= {fx:0,sw:0,u:0}; g[k].fx += num(c.fxPl); g[k].sw += num(c.swapTotal); g[k].u += num(c.units); });
  let tf = 0, ts = 0;
  html += `<div class="tablebox"><table class="sum"><thead><tr><th>通貨ペア</th><th>計</th><th>為替損益</th><th>累計SW</th><th>通貨</th></tr></thead><tbody>`;
  for (const [k,v] of Object.entries(g).sort((a,b)=>(b[1].fx+b[1].sw)-(a[1].fx+a[1].sw))){
    tf += v.fx; ts += v.sw;
    html += `<tr><td>${esc(k)}</td><td class="${cls(v.fx+v.sw)}">${signed(v.fx+v.sw)}</td><td class="${cls(v.fx)}">${signed(v.fx)}</td><td>${yen(v.sw)}</td><td>${v.u.toLocaleString("ja-JP")}</td></tr>`;
  }
  html += `</tbody><tfoot><tr><td>合計</td><td class="${cls(tf+ts)}">${signed(tf+ts)}</td><td class="${cls(tf)}">${signed(tf)}</td><td>${yen(ts)}</td><td></td></tr></tfoot></table></div></section>`;
  html += `<section><h2>決済履歴</h2><ul class="rows">`;
  cs.forEach(c => {
    const t = num(c.fxPl) + num(c.swapTotal);
    html += `<li><button class="row pos" data-edit-closed="${esc(c.id)}">
      <span class="p">${esc(c.pair)}<span class="tag">${esc(c.broker||"")}</span></span>
      <span class="v ${cls(t)}">${signed(t)}</span>
      <span class="m">${fmtDate(c.openDate)} → ${fmtDate(c.closeDate)}　${num(c.units).toLocaleString("ja-JP")}通貨</span>
      <span class="mr">為替 ${signed(num(c.fxPl))} / SW ${yen(num(c.swapTotal))}</span>
    </button></li>`;
  });
  return html + `</ul></section>`;
}

function viewGoals(){
  const g = state.goals[0] || {};
  const last = weeksSorted().slice(-1)[0];
  const principal = cashPrincipal();
  const dailySwapNow = state.positions.reduce((s2,p) => s2 + posDailySwap(p), 0);
  const row = (label, actual, target, key) => {
    const pct = target ? Math.min(100, Math.round(actual / target * 100)) : null;
    return `<div class="goalrow">
      <div class="goalhead"><span>${label}</span><input class="fld-goal" data-key="${key}" inputmode="numeric" placeholder="目標を入力" value="${target ? num(target).toLocaleString('ja-JP') : ''}"></div>
      <div class="goalbar"><div class="goalfill" style="width:${pct ?? 0}%"></div></div>
      <div class="goalstat">実績 ${yen(actual)}${pct != null ? `　目標 ${yen(target)}（${pct}%）` : "　目標未設定"}</div>
    </div>`;
  };
  let html = `<section><h2>目標・実績</h2>
    <p class="hint">目標額を入力すると、直近の実績と比べた達成率を表示します。</p>
    ${row("月間スワップ", last ? monthly(last) : 0, g.monthlyTarget, "monthlyTarget")}
    ${row("年間スワップ", last ? yearly(last) : 0, g.yearlyTarget, "yearlyTarget")}
    ${row("元金", principal, g.principalTarget, "principalTarget")}
  </section>`;
  html += `<section><h2>1日あたりスワップの目標（複数時点）<span class="act"><button class="linkbtn" data-act="addMilestone">＋ 追加</button></span></h2>`;
  const ms = [...state.milestones].sort((a,b) => (a.targetDate||"").localeCompare(b.targetDate||""));
  if (!ms.length){
    html += `<div class="empty">「〇年〇月までに1日あたりスワップ〇円」という目標を複数登録できます。<br><button class="btn" data-act="addMilestone">目標を追加</button></div>`;
  } else {
    ms.forEach(m => {
      const pct = num(m.targetAmount) ? Math.min(100, Math.round(dailySwapNow / num(m.targetAmount) * 100)) : null;
      const [y, mo] = (m.targetDate||"").split("-");
      html += `<button class="goalrow" data-edit-milestone="${esc(m.id)}" style="all:unset;display:block;width:100%;cursor:pointer;box-sizing:border-box;margin-bottom:14px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)">
        <div class="goalhead"><span>${y}年${mo?Number(mo):""}月</span><span style="font-family:var(--serif);font-weight:700">${yen(num(m.targetAmount))}</span></div>
        <div class="goalbar"><div class="goalfill" style="width:${pct ?? 0}%"></div></div>
        <div class="goalstat">実績 ${yen(dailySwapNow)}${pct != null ? `（${pct}%）` : ""}</div>
      </button>`;
    });
  }
  return html + `</section>`;
}

function openMilestone(m){
  openSheet(m ? "目標を編集" : "目標を追加", `
    ${field("目標の年月","targetDate", m?m.targetDate:"", "month")}
    ${field("目標スワップ（円/日）","targetAmount", m&&m.targetAmount?num(m.targetAmount).toLocaleString("ja-JP"):"","text",'inputmode="numeric"')}
    ${actions(!!m)}`);
  const amt = $("#sheetIn").querySelector('[name="targetAmount"]');
  amt.oninput = () => { amt.value = amt.value.replace(/[^\d]/g,""); };
  wire(async () => {
    const v = formVals();
    if (!v.targetDate){ toast("年月を選んでください"); return; }
    if (!num(v.targetAmount)){ toast("目標スワップを入力してください"); return; }
    if (!(await save("milestones", m ? m.id : null, {targetDate:v.targetDate, targetAmount:num(v.targetAmount)}))) return;
    closeSheet(); toast("保存しました");
  }, () => removeDoc("milestones", m.id));
}

function viewCash(){
  const cs = [...state.cash].sort((a,b) => (b.date||"").localeCompare(a.date||""));
  let html = `<section><h2>入出金<span class="act"><button class="linkbtn" data-act="addCash">＋ 追加</button></span></h2>`;
  if (!cs.length) return html + `<div class="empty">入金・出金を記録すると元金が自動で計算され、毎週の「利益（評価−元金）」に使われます。<br><button class="btn" data-act="addCash">入出金を追加</button></div></section>`;
  const inn = cs.filter(c=>c.kind==="in").reduce((s,c)=>s+num(c.amount),0), out = cs.filter(c=>c.kind==="out").reduce((s,c)=>s+num(c.amount),0), cb = cs.filter(c=>c.kind==="cashback").reduce((s,c)=>s+num(c.amount),0);
  const last = weeksSorted().slice(-1)[0];
  html += `<div class="calc"><span>元金（入金−出金）</span><b>${yen(inn-out)}</b><span>入金合計 / 出金合計</span><span>${yen(inn)} / ${yen(out)}</span><span>キャッシュバック合計</span><span class="gain">${yen(cb)}</span>${last ? `<span>最新の有効評価との差</span><span class="${cls(last.equity-(inn-out))}">${signed(last.equity-(inn-out))}</span>` : ""}</div><ul class="rows">`;
  cs.forEach(c => {
    const label = c.kind === "out" ? "出金" : c.kind === "cashback" ? "CB" : "入金";
    html += `<li><button class="cashc" data-edit-cash="${esc(c.id)}">
      <span class="cc-date">${fmtDate(c.date)}</span>
      <span class="tag">${label}</span>
      <span class="cc-broker">${esc(c.broker||"")}${c.memo ? "・" + esc(c.memo) : ""}</span>
      <span class="cc-amt ${c.kind==="out"?"loss":c.kind==="cashback"?"gain":""}">${c.kind==="out"?"−":"+"}${yen(num(c.amount))}</span>
    </button></li>`;
  });
  return html + `</ul></section>`;
}

function bindView(){
  const v = $("#view");
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ({record:()=>openWeek(), addPos:()=>openPos(), addClosed:()=>openClosed(), addCash:()=>openCash(), toggleWeeks:()=>{weeksExpanded = !weeksExpanded; render();}, swapBreakdown:()=>openSwapBreakdown(), addMilestone:()=>openMilestone()})[b.dataset.act]());
  v.querySelectorAll("[data-edit-week]").forEach(b => b.onclick = () => openWeek(state.weeks.find(w=>w.id===b.dataset.editWeek)));
  v.querySelectorAll("[data-edit-pos]").forEach(b => b.onclick = () => openPos(state.positions.find(w=>w.id===b.dataset.editPos)));
  v.querySelectorAll(".holdseg button").forEach(b => b.onclick = () => { holdView[b.parentNode.dataset.broker] = b.dataset.v; render(); });
  v.querySelectorAll("[data-edit-closed]").forEach(b => b.onclick = () => openClosed(state.closed.find(w=>w.id===b.dataset.editClosed)));
  v.querySelectorAll("[data-edit-cash]").forEach(b => b.onclick = () => openCash(state.cash.find(w=>w.id===b.dataset.editCash)));
  v.querySelectorAll("[data-edit-milestone]").forEach(b => b.onclick = () => openMilestone(state.milestones.find(w=>w.id===b.dataset.editMilestone)));
  v.querySelectorAll("[data-panel]").forEach(b => b.onclick = () => { settingsView = b.dataset.panel; render(); });
  v.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { settingsView = null; render(); });
  v.querySelectorAll(".fld-lot").forEach(i => {
    i.dataset.orig = i.value;
    i.oninput = () => { i.value = i.value.replace(/[^\d]/g,""); };
    i.onblur = () => { if (i.value === i.dataset.orig) return; const n2 = num(i.value); i.value = n2 ? n2.toLocaleString("ja-JP") : ""; i.dataset.orig = i.value; saveSetting(i.dataset.broker, i.dataset.pair, {lotSize:n2}); };
  });
  v.querySelectorAll(".fld-minlot").forEach(i => {
    i.dataset.orig = i.value;
    i.onblur = () => { if (i.value === i.dataset.orig) return; i.dataset.orig = i.value; saveSetting(i.dataset.broker, "", {minLot:i.value === "" ? null : num(i.value)}); };
  });
  v.querySelectorAll(".fld-maxpos").forEach(i => {
    i.dataset.orig = i.value;
    i.oninput = () => { i.value = i.value.replace(/[^\d]/g,""); };
    i.onblur = () => { if (i.value === i.dataset.orig) return; const n2 = num(i.value); i.value = n2 ? n2.toLocaleString("ja-JP") : ""; i.dataset.orig = i.value; saveSetting(i.dataset.broker, i.dataset.pair, {maxPosition:n2}); };
  });
  v.querySelectorAll(".fld-swap").forEach(i => {
    i.dataset.orig = i.value;
    i.onblur = async () => { if (i.value === i.dataset.orig) return; i.dataset.orig = i.value; if (await saveSetting(i.dataset.broker, i.dataset.pair, {swapPoint:i.value === "" ? null : num(i.value)})) render(); };
  });
  v.querySelectorAll(".fld-margin").forEach(i => {
    i.dataset.orig = i.value;
    i.oninput = () => { i.value = i.value.replace(/[^\d]/g,""); };
    i.onblur = async () => { if (i.value === i.dataset.orig) return; const n2 = num(i.value); i.value = n2 ? n2.toLocaleString("ja-JP") : ""; i.dataset.orig = i.value; if (await saveSetting(i.dataset.broker, i.dataset.pair, {marginRequired:n2 || null})) render(); };
  });
  v.querySelectorAll(".fld-goal").forEach(i => {
    i.dataset.orig = i.value;
    i.oninput = () => { i.value = i.value.replace(/[^\d]/g,""); };
    i.onblur = async () => { if (i.value === i.dataset.orig) return; const n2 = num(i.value); if (await saveGoal({[i.dataset.key]: n2 || null})) render(); };
  });
}

/* ---------- sheet ---------- */
let lastFocus = null;
function openSheet(title, body){
  lastFocus = document.activeElement;
  const s = $("#sheetIn");
  s.oninput = null; s.onchange = null;
  s.innerHTML = `<h3>${esc(title)}<button class="close" aria-label="閉じる" data-close>×</button></h3>${body}`;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
  s.querySelector("[data-close]").onclick = closeSheet;
  setTimeout(() => s.querySelector("[data-close]").focus({preventScroll:true}), 60);
}
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); if (lastFocus) lastFocus.focus?.(); }
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
const field = (label, name, val, type="text", extra="") => `<label class="f"><span>${label}</span><input name="${name}" type="${type}" value="${esc(val ?? "")}" ${type==="text"&&/金|額|スワップ|損益|数|評価/.test(label)?'inputmode="decimal"':""} ${extra}></label>`;
const select = (label, name, val, opts) => `<label class="f"><span>${label}</span><select name="${name}">${val ? "" : `<option value="" selected disabled>選択してください</option>`}${[...new Set([...(val?[val]:[]),...opts])].map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
const seg = (name, val, opts) => `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join("")}</div>`;
const actions = (hasDelete) => `<div class="actions">${hasDelete ? `<button class="btn danger small" data-del>削除</button>` : ""}<div class="right"><button class="btn ghost" data-close2>やめる</button><button class="btn" data-save>保存する</button></div></div>`;
function formVals(){ const o = {}; $("#sheetIn").querySelectorAll("input[name],select[name],textarea[name]").forEach(i => o[i.name] = i.value.trim()); $("#sheetIn").querySelectorAll("[data-seg]").forEach(s => o[s.dataset.seg] = s.querySelector('[aria-pressed="true"]').dataset.v); return o; }
function wire(onSave, onDel){
  const s = $("#sheetIn");
  s.querySelectorAll("[data-seg] button").forEach(b => b.onclick = () => { b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x===b)); s.dispatchEvent(new Event("input")); });
  s.querySelector("[data-close2]").onclick = closeSheet;
  s.querySelector("[data-save]").onclick = onSave;
  const d = s.querySelector("[data-del]"); if (d) d.onclick = () => { if (confirm("この項目を削除しますか？")) { onDel(); closeSheet(); toast("削除しました"); } };
}

/* weekly record */
function openWeek(w){
  const ws = weeksSorted(), last = ws[ws.length-1];
  const hasCash = state.cash.length > 0;
  const principal = w ? w.principal : hasCash ? cashPrincipal() : last ? last.principal : 0;
  const dailyAuto = state.positions.reduce((s2,p) => s2 + posDailySwap(p), 0);
  const daily = w ? w.daily : dailyAuto;
  let brokers = w && w.brokers ? {...w.brokers} : {};
  if (!w){
    const names = [...new Set([...state.positions.map(p=>p.broker).filter(Boolean), ...Object.keys((last&&last.brokers)||{})])];
    names.forEach(n => brokers[n] = "");
  }
  const brokerHtml = () => Object.keys(brokers).map((n,i) => `<div class="brokerRow"><input data-bn="${i}" value="${esc(n)}" aria-label="業者名"><input data-bv="${i}" inputmode="decimal" placeholder="有効評価額" value="${esc(brokers[n])}" aria-label="${esc(n)}の有効評価額"><button class="x" data-bx="${i}" aria-label="削除">×</button></div>`).join("");
  openSheet(w ? `${fmtDate(w.date)} の記録` : "今週の記録", `
    <div style="max-width:160px">${field("記録日","date", w ? w.date : today(), "date")}</div>
    <div class="f"><span>業者ごとの有効評価額（合計が有効評価額になります）</span><div id="bRows">${brokerHtml()}</div><button class="linkbtn" id="bAdd">＋ 業者を追加</button></div>
    ${field("有効評価額（合計）","equity", w ? w.equity : "", "text", 'inputmode="decimal"')}
    ${field("1日あたりスワップ","daily", daily, "text", 'inputmode="decimal" style="background:var(--paper-2)"')}
    ${field("元金" + (!w && hasCash ? "（入出金から自動計算）" : ""),"principal", principal, "text", 'inputmode="decimal" style="background:var(--paper-2)"')}
    <div class="calc" id="wcalc"></div>
    ${field("メモ","memo", w ? w.memo : "")}
    ${actions(!!w)}`);
  const s = $("#sheetIn");
  const readBrokers = () => { const o = {}; s.querySelectorAll("[data-bn]").forEach(i => { const n = i.value.trim(); if (n) o[n] = s.querySelector(`[data-bv="${i.dataset.bn}"]`).value.trim(); }); return o; };
  const redraw = () => { s.querySelector("#bRows").innerHTML = brokerHtml(); bindRows(); };
  const bindRows = () => {
    s.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => { brokers = readBrokers(); delete brokers[Object.keys(brokers)[b.dataset.bx]]; redraw(); sumUp(); });
    s.querySelectorAll("[data-bv],[data-bn]").forEach(i => i.oninput = () => { brokers = readBrokers(); sumUp(); });
  };
  const sumUp = () => { const vals = Object.values(brokers).filter(v => v !== ""); if (vals.length) s.querySelector('[name="equity"]').value = vals.reduce((a,v)=>a+num(v),0); calc(); };
  const calc = () => {
    const v = formVals(), eq = num(v.equity), pr = num(v.principal), d = num(v.daily);
    s.querySelector("#wcalc").innerHTML = `<span>利益（評価−元金）</span><b class="${eq ? cls(eq-pr) : ""}">${eq ? signed(eq-pr) : "—"}</b><span>月間 / 年間スワップ</span><span>${yen(d*30)} / ${yen(d*365)}</span>`;
  };
  s.querySelector("#bAdd").onclick = () => { brokers = readBrokers(); const n = BROKERS.find(b => !(b in brokers)) || "業者" + (Object.keys(brokers).length+1); brokers[n] = ""; redraw(); };
  s.oninput = calc; bindRows(); calc();
  wire(async () => {
    const v = formVals();
    if (!v.date || !num(v.equity)){ toast("記録日と有効評価額を入力してください"); return; }
    const b = readBrokers(), bClean = {}; for (const k in b) if (b[k] !== "") bClean[k] = num(b[k]);
    const doc = {date:v.date, equity:num(v.equity), principal:num(v.principal), daily:num(v.daily), brokers:bClean, memo:v.memo};
    if (w && w.date !== v.date) await removeDoc("weeks", w.id);
    if (await save("weeks", w && w.date === v.date ? w.id : null, doc)){ closeSheet(); toast("記録しました"); }
  }, () => removeDoc("weeks", w.id));
}

function openPos(p){
  openSheet(p ? "ポジションを編集" : "ポジションを追加", `
    <div class="two">${select("証券会社","broker",p?p.broker:"",BROKERS)}${select("通貨ペア","pair",p?p.pair:"",pairsFor(p?p.broker:""))}</div>
    <div class="f"><span>売買</span>${seg("side", p ? p.side : "buy", [["buy","買い"],["sell","売り"]])}</div>
    <div class="two">
      <label class="f"><span id="lotsLabel">発注数量</span><div style="display:flex;align-items:center;gap:6px"><input name="lots" type="text" inputmode="decimal" value="${p?p.lots:''}" style="flex:1 1 auto"><span id="lotsUnit" style="flex:0 0 auto;color:var(--ink-2);font-size:14px;white-space:nowrap">lot</span></div></label>
      <label class="f"><span>数量（通貨）</span><div id="unitsCalc" style="padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);font-weight:700">—</div></label>
    </div>
    <p class="hint" id="capHint"></p>
    <div class="two">${field("建値レート","rate",p?p.rate:"","text",'inputmode="decimal"')}${field("建玉日","openDate",p?p.openDate:today(),"date")}</div>
    ${p ? `<button class="linkbtn" data-toclosed>このポジションを決済済みにする</button>` : ""}
    ${actions(!!p)}`);
  const s = $("#sheetIn");
  const pairSel = s.querySelector('[name="pair"]');
  s.querySelector('[name="broker"]').addEventListener("change", e => {
    const opts = pairsFor(e.target.value);
    pairSel.innerHTML = `<option value="" selected disabled>選択してください</option>` + opts.map(o => `<option>${esc(o)}</option>`).join("");
  });
  const recalc = () => {
    const v = formVals(), ls = orderUnitFactor(v.broker, v.pair), lots = num(v.lots), min = minLotOf(v.broker);
    const u = ls && lots ? lots * ls : null;
    s.querySelector("#unitsCalc").textContent = !v.broker || !v.pair ? "証券会社と通貨ペアを選んでください" : !ls ? "設定タブで取引単位を登録してください" : !lots ? "—" : u.toLocaleString("ja-JP") + "通貨";
    s.querySelector("#lotsLabel").textContent = "発注数量" + (min != null ? `（最小 ${min}）` : "");
    s.querySelector("#lotsUnit").textContent = v.broker ? minUnitLabel(v.broker) : "lot";
    const capRaw = maxPositionOf(v.broker, v.pair), capUnit = MAXPOS_UNIT[v.broker] || "lot";
    let capText = "";
    if (capRaw != null){
      const existingUnits = state.positions.filter(x => x.broker === v.broker && x.pair === v.pair && (!p || x.id !== p.id)).reduce((s2,x) => s2 + num(x.units), 0);
      const existingInCapUnit = capUnit === "万通貨" ? existingUnits / 10000 : (ls ? existingUnits / ls : null);
      capText = `建玉上限 ${capRaw}${capUnit}（現在の保有 ${existingInCapUnit != null ? existingInCapUnit.toLocaleString("ja-JP",{maximumFractionDigits:2}) : "—"}${capUnit}）`;
    }
    s.querySelector("#capHint").textContent = capText;
    return u;
  };
  s.oninput = recalc; s.onchange = recalc; recalc();
  const tc = s.querySelector("[data-toclosed]");
  if (tc) tc.onclick = () => { closeSheet(); setTimeout(() => openClosed(null, p), 250); };
  wire(async () => {
    const v = formVals();
    if (!v.broker || !v.pair){ toast("証券会社と通貨ペアを選んでください"); return; }
    const units = recalc();
    if (!num(v.lots)){ toast("Lot数を入力してください"); return; }
    if (!units){ toast("先に設定タブで取引単位を登録してください"); return; }
    const mv = minViolation(v.broker, num(v.lots), units);
    if (mv){ toast(`最小取引単位は${mv.min}${mv.unit}です`); return; }
    const capUnits = maxPositionUnits(v.broker, v.pair);
    if (capUnits != null){
      const existingUnits = state.positions.filter(x => x.broker === v.broker && x.pair === v.pair && (!p || x.id !== p.id)).reduce((s2,x) => s2 + num(x.units), 0);
      if (existingUnits + units > capUnits){ const capRaw = maxPositionOf(v.broker, v.pair), capUnit = MAXPOS_UNIT[v.broker] || "lot"; toast(`建玉上限（${capRaw}${capUnit}）を超えます`); return; }
    }
    if (!(await save("positions", p ? p.id : null, {broker:v.broker, pair:v.pair, side:v.side, lots:num(v.lots), units, rate:v.rate, openDate:v.openDate}))) return;
    closeSheet(); toast("保存しました");
  }, () => removeDoc("positions", p.id));
}

function fxPlCalc(units, side, openRate, closeRate){
  const u = num(units), or = num(openRate), cr = num(closeRate);
  if (!u || !or || !cr) return null;
  return Math.round((cr - or) * u * (side === "sell" ? -1 : 1));
}

function openClosed(c, fromPos){
  if (!c && !fromPos){
    if (!state.positions.length){
      openSheet("決済を追加", `<div class="empty">保有ポジションがありません。<br><button class="btn" data-act="addPos">保有タブでポジションを追加</button></div>`);
      $("#sheetIn").querySelector("[data-act]").onclick = () => { closeSheet(); tab = "hold"; render(); setTimeout(openPos, 250); };
      return;
    }
    const opts = state.positions.map(p => `<option value="${esc(p.id)}">${esc(p.broker)}・${esc(p.pair)}・${num(p.units).toLocaleString("ja-JP")}通貨・${p.side==="sell"?"売":"買"}（${fmtDate(p.openDate)}）</option>`).join("");
    openSheet("決済を追加", `<label class="f"><span>決済するポジション</span><select name="pickPos">${opts}</select></label><div id="closeBody"></div>`);
    const s = $("#sheetIn");
    const sel = s.querySelector('[name="pickPos"]');
    const draw = () => openClosedBody(state.positions.find(p => p.id === sel.value), null, true);
    sel.onchange = draw;
    draw();
    return;
  }
  openClosedBody(fromPos || null, c, false);
}

function openClosedBody(pos, c, nested){
  const src = c || (pos ? {broker:pos.broker, pair:pos.pair, units:pos.units, side:pos.side, openRate:pos.rate, openDate:pos.openDate, closeDate:today()} : null);
  const editableIdent = !pos;
  const identHtml = editableIdent ? `
      <div class="two">${select("証券会社","broker",src?src.broker:BROKERS[0],BROKERS)}${select("通貨ペア","pair",src?src.pair:PAIRS[0],pairsFor(src?src.broker:BROKERS[0]))}</div>
      <div class="f"><span>売買</span>${seg("side", src?src.side:"buy", [["buy","買い"],["sell","売り"]])}</div>
      <div class="two">${field("数量（通貨）","units",src?src.units:"","text",'inputmode="numeric"')}${field("建玉レート","openRate",src?src.openRate:"","text",'inputmode="decimal"')}</div>
      ${field("建玉日","openDate",src?src.openDate:"","date")}` : `
      <div class="calc" style="grid-template-columns:auto 1fr">
        <span>証券会社</span><span>${esc(pos.broker)}</span>
        <span>通貨ペア</span><span>${esc(pos.pair)}</span>
        <span>数量・売買</span><span>${num(pos.units).toLocaleString("ja-JP")}通貨・${pos.side==="sell"?"売":"買"}</span>
        <span>建玉日・建玉レート</span><span>${fmtDate(pos.openDate)}・${pos.rate?esc(pos.rate):"—"}</span>
      </div>`;
  const bodyHtml = `${identHtml}
    <div class="two">${field("決済日","closeDate",src?src.closeDate:today(),"date")}${field("決済レート","closeRate",src?src.closeRate:"","text",'inputmode="decimal"')}</div>
    ${field("累計スワップ（円）","swapTotal",src?src.swapTotal:"","text",'inputmode="decimal"')}
    <div class="calc"><span>為替損益（自動計算）</span><b id="fxPlCalc">—</b></div>
    ${!editableIdent && !c ? `<p class="hint">保存すると保有ポジションから外れます。</p>` : ""}
    ${actions(!!c)}`;
  if (nested){
    $("#sheetIn").querySelector("#closeBody").innerHTML = bodyHtml;
  } else {
    openSheet(c ? "決済を編集" : "決済を追加", bodyHtml);
    if (editableIdent){
      $("#sheetIn").querySelector('[name="broker"]').addEventListener("change", e => {
        const pairSel = $("#sheetIn").querySelector('[name="pair"]');
        const opts = pairsFor(e.target.value);
        pairSel.innerHTML = `<option value="" selected disabled>選択してください</option>` + opts.map(o => `<option>${esc(o)}</option>`).join("");
      });
    }
  }
  const s = $("#sheetIn");
  const recalcFx = () => {
    const v = formVals();
    const units = editableIdent ? v.units : pos.units;
    const side = editableIdent ? v.side : pos.side;
    const openRate = editableIdent ? v.openRate : pos.rate;
    const pl = fxPlCalc(units, side, openRate, v.closeRate);
    s.querySelector("#fxPlCalc").textContent = pl == null ? "—" : signed(pl);
  };
  s.oninput = recalcFx; s.onchange = recalcFx; recalcFx();
  wire(async () => {
    const v = formVals();
    const units = num(editableIdent ? v.units : pos.units);
    const side = editableIdent ? v.side : pos.side;
    const broker = editableIdent ? v.broker : pos.broker;
    const pair = editableIdent ? v.pair : pos.pair;
    const openDate = editableIdent ? v.openDate : pos.openDate;
    const openRate = editableIdent ? v.openRate : pos.rate;
    if (!units){ toast("数量を入力してください"); return; }
    if (!v.closeRate){ toast("決済レートを入力してください"); return; }
    const pl = fxPlCalc(units, side, openRate, v.closeRate) || 0;
    if (!(await save("closed", c ? c.id : null, {broker, pair, units, openDate, closeDate:v.closeDate, openRate, closeRate:v.closeRate, fxPl:pl, swapTotal:num(v.swapTotal)}))) return;
    if (pos && !c) await removeDoc("positions", pos.id);
    closeSheet(); toast("保存しました");
  }, () => removeDoc("closed", c.id));
}

function openCash(c){
  openSheet(c ? "入出金を編集" : "入出金を追加", `
    <div class="f"><span>種類</span>${seg("kind", c ? c.kind : "in", [["in","入金"],["out","出金"],["cashback","キャッシュバック"]])}</div>
    ${field("日付","date",c?c.date:today(),"date")}
    ${field("金額（円）","amount",c&&c.amount?num(c.amount).toLocaleString("ja-JP"):"","text",'inputmode="numeric"')}
    ${select("証券会社","broker",c?c.broker:BROKERS[0],BROKERS)}
    ${field("メモ","memo",c?c.memo:"")}
    ${actions(!!c)}`);
  $("#sheetIn").querySelector('[name="amount"]').oninput = e => { const d = e.target.value.replace(/[^\d]/g,""); e.target.value = d ? Number(d).toLocaleString("ja-JP") : ""; };
  wire(async () => {
    const v = formVals();
    if (!num(v.amount)){ toast("金額を入力してください"); return; }
    if (!(await save("cash", c ? c.id : null, {kind:v.kind, date:v.date, amount:num(v.amount), broker:v.broker, memo:v.memo}))) return;
    closeSheet(); toast("保存しました");
  }, () => removeDoc("cash", c.id));
}

document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });
let rw = window.innerWidth;
window.addEventListener("resize", () => { if ((rw < 600) !== (window.innerWidth < 600)){ rw = window.innerWidth; render(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (t.tagName !== "INPUT" || t.closest("#loginForm")) return;
  e.preventDefault();
  const scope = t.closest("#sheetIn") || t.closest("#view") || document;
  const col = [...t.classList].find(c => c.startsWith("fld-"));
  const fields = [...scope.querySelectorAll(col ? "." + col : "input, select")].filter(el => !el.disabled && el.type !== "hidden" && el.offsetParent !== null);
  const i = fields.indexOf(t);
  if (i > -1 && i < fields.length - 1) fields[i+1].focus();
  else t.blur();
});
/* iOS: 日付ピッカーの開閉でビューポートが動いたとき、シートのタップ位置がズレないよう追従させる */
if (window.visualViewport){
  const vv = window.visualViewport;
  const reposition = () => { $("#sheet").style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px"; };
  vv.addEventListener("resize", reposition);
  vv.addEventListener("scroll", reposition);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
render();
boot();
})();
</script>
</body>
</html>
